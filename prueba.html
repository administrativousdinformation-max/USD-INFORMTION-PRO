<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — USDINFORMATION</title>
<style>
    :root {
        --bgMain: #0d0d1a;
        --accent: #ff2d55;
        --textMain: #ffffff;
        --textMuted: #a0a0a0;
        --panelBg: #161428;
    }
    * { box-sizing: border-box; }
    body, html {
        margin: 0; padding: 0; height: 100%;
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(ellipse at 20% 30%, #1a0a2e 0%, #0d0d1a 45%, #090912 100%) fixed;
        color: var(--textMain);
    }
    .glass-card {
        background: var(--panelBg);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    /* LOGIN */
    #loginScreen {
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box { width: 100%; max-width: 380px; padding: 34px 30px; text-align: center; }
    .login-icon {
        width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 20px;
        background: linear-gradient(135deg, rgba(255,45,85,0.35), rgba(180,0,60,0.2));
        border: 2px solid rgba(255,45,85,0.5);
        display: flex; align-items: center; justify-content: center; font-size: 2.4rem;
        box-shadow: 0 0 40px rgba(255,45,85,0.4), 0 0 80px rgba(255,45,85,0.15);
        animation: loginFloat 4s ease-in-out infinite;
    }
    @keyframes loginFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .login-logo {
        font-size: 1.7rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px;
        background: linear-gradient(135deg, #ff2d55, #ff6b8a, #ff2d55);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .login-sub { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
    .login-box h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .login-box p { margin: 0 0 22px; color: var(--textMuted); font-size: 12px; }
    .login-input {
        width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none;
        margin-bottom: 12px;
    }
    .login-btn {
        width: 100%; background: var(--accent); color: #fff; border: none; padding: 13px;
        border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer;
        box-shadow: 0 4px 16px rgba(255,45,85,0.35); transition: 0.2s;
    }
    .login-btn:hover { opacity: 0.88; }
    #loginError {
        display: none; background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4);
        color: #ff8a80; font-size: 12px; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px;
    }
    /* APP */
    #appScreen { display: none; min-height: 100vh; padding: 20px; }
    .app-header {
        max-width: 500px; margin: 0 auto 18px; display: flex; align-items: center;
        justify-content: space-between; padding: 18px 24px; gap: 14px;
    }
    .app-header .name { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 16px; min-width: 0; }
    .app-header .name-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .app-header .name-text #nombreUsuarioActivo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-header .name-text #cargoUsuarioActivo {
        font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent);
    }
    #iconoUsuarioActivo { font-size: 2.2rem; line-height: 1; }
    .user-avatar {
        width: 68px; height: 68px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
        border: 3px solid var(--accent); background: rgba(255,255,255,0.08);
        box-shadow: 0 0 18px rgba(255,45,85,0.4);
    }
    .app-header .logout-btn { padding: 9px 16px; font-size: 12px; flex-shrink: 0; }
    @media (max-width: 480px) {
        .app-header { padding: 14px 14px; }
        .app-header .name { font-size: 15px; gap: 12px; }
        .user-avatar { width: 54px; height: 54px; }
    }
    .logout-btn {
        background: rgba(255,255,255,0.07); color: var(--textMuted); border: 1px solid rgba(255,255,255,0.12);
        padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .logout-btn:hover { color: #fff; }
</style>
</head>
<body>

<div id="loginScreen">
    <div class="glass-card login-box">
        <div class="login-icon">💼</div>
        <div class="login-logo">⚡ USDINFORMATION</div>
        <div class="login-sub">Plataforma de Gestión y Monitoreo</div>
        <p>Ingresa con tu usuario y contraseña para comenzar.</p>
        <div id="loginError"></div>
        <input id="inputUsuario" class="login-input" placeholder="Usuario" autocomplete="off">
        <input id="inputPassword" class="login-input" type="password" placeholder="Contraseña" autocomplete="off">
        <button class="login-btn" onclick="intentarLogin()">Ingresar</button>
    </div>
</div>

<div id="restoreScreen" style="display:none;min-height:100vh;align-items:center;justify-content:center;color:var(--textMuted);font-size:14px;">Restaurando sesión…</div>

<div id="appScreen">
    <div class="glass-card app-header">
        <span class="name">
            <img id="avatarUsuarioActivo" class="user-avatar" alt="" style="display:none;">
            <span id="iconoUsuarioActivo">👤</span>
            <span class="name-text">
                <span id="nombreUsuarioActivo"></span>
                <span id="cargoUsuarioActivo"></span>
            </span>
        </span>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
    <div id="chatPruebaContenido" style="max-width:500px;margin:0 auto;"></div>
</div>

<!-- ═══════ FIREBASE (misma configuración que el sistema principal) ═══════ -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, child, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyCgC0JLbQgUbWcBykWWC-znSDskbqtCBuA",
        authDomain:        "usd-admi.firebaseapp.com",
        databaseURL:       "https://usd-admi-default-rtdb.firebaseio.com",
        projectId:         "usd-admi",
        storageBucket:     "usd-admi.firebasestorage.app",
        messagingSenderId: "922009717158",
        appId:             "1:922009717158:web:8e99483e1a92d0a880e767",
    };

    const _fbApp = initializeApp(firebaseConfig);
    const _db    = getDatabase(_fbApp);
    const _storage = getStorage(_fbApp);

    window._fbGuardar = async function(clave, datos) {
        try { await set(ref(_db, 'sistema/' + clave), datos); }
        catch(e) { console.warn('[RTDB] write error:', e); }
    };
    window._fbCargar = async function(clave) {
        try {
            const snap = await get(child(ref(_db), 'sistema/' + clave));
            if (snap.exists()) return snap.val();
        } catch(e) { console.warn('[RTDB] read error:', e); }
        return null;
    };
    // Sube un dataUrl a Firebase Storage (ahorra cuota de descargas de RTDB al no
    // repetir el base64 en cada sincronización del chat de prueba)
    window._fbSubirFoto = async function(dataUrl, path) {
        try {
            const [meta, b64] = dataUrl.split(',');
            const mime = meta.match(/:(.*?);/)[1];
            const bytes = atob(b64);
            const arr = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
            const blob = new Blob([arr], { type: mime });
            const sRef = storageRef(_storage, path);
            await uploadBytes(sRef, blob);
            return await getDownloadURL(sRef);
        } catch(e) {
            console.warn('[Storage] upload error:', e);
            return null;
        }
    };
    window._fbValToArray = function(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val.filter(x => x != null);
        if (typeof val === 'object') {
            const keys = Object.keys(val).sort((a,b) => Number(a) - Number(b));
            return keys.map(k => val[k]).filter(x => x != null);
        }
        return [];
    };
    window._fbDb = _db;
    window._fbModules = { getDatabase, ref, onValue, set, get, child, runTransaction };
    window._fbReady = true;
</script>

<!-- ═══════ LÓGICA DE LA APP DE PRUEBA ═══════ -->
<script>
// Solo las dos cuentas de prueba, como respaldo si no hay conexión a Firebase al cargar.
// Si Firebase responde, se usa la lista real (por si cambian las contraseñas desde el sistema principal).
const _listaBasePrueba = [
    { nombre: "Prueba Uno", usuario: "PRUEBA.1", password: "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92", rol: "prueba" },
    { nombre: "Prueba Dos", usuario: "PRUEBA.2", password: "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92", rol: "prueba" },
    { nombre: "Conductor Uno", usuario: "CONDUCTOR.1", password: "85bbd300ba8f4b46443bc97dff500767e03a3cd9f0847b9e6c9a1b16f79d9ad7", rol: "conductor", foto: "Fotos Empresa/Conductor.jpg" },
    { nombre: "Andrés Felipe Ausique Marín", usuario: "SELECCION.1", password: "c473e572532b053f71f606fd364e1f127f62d8462d072cd041ef1ea9cb2eeab8", rol: "seleccion", foto: "Fotos Empresa/Andres.jpg" },
    { nombre: "Yully Tatiana Diaz Diaz", usuario: "SELECCION.2", password: "645c9d4ea03e34824845b15194f73e0afb2e80748877cbc8eca30acb00666bd8", rol: "seleccion", foto: "Fotos Empresa/Yully.jpg" },
];

let usuarios = [];
let userLogueado = null;

// Cargos que ingresan por este archivo: 'prueba' (candidatos) más Conductor y Selección.
const _ROLES_PERMITIDOS = ['prueba', 'conductor', 'seleccion'];
const _CARGO_INFO = {
    conductor: { icono: '🚗', etiqueta: 'Conductor' },
    seleccion: { icono: '🧑‍💼', etiqueta: 'Selección' },
};

async function _hashConSalt(password, usuarioId) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password + ':usd:' + usuarioId.toUpperCase()));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function _hashSimple(password) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function _cargarUsuarios() {
    try {
        const data = window._fbCargar ? await window._fbCargar('usuarios_usd') : null;
        usuarios = data ? window._fbValToArray(data) : [..._listaBasePrueba];
        if (!usuarios.length) usuarios = [..._listaBasePrueba];
        // Cuentas base que aún no estén en la lista de Firebase (p.ej. recién creadas): se agregan
        _listaBasePrueba.forEach(b => { if (!usuarios.some(x => String(x.usuario).trim().toUpperCase() === b.usuario)) usuarios.push(b); });
        // Nombres de Selección: reemplaza el nombre provisional si aún lo tienen
        usuarios.forEach(x => { const b = _listaBasePrueba.find(z => z.usuario === String(x.usuario).trim().toUpperCase()); if (b && /^SELECCION\.[12]$/.test(b.usuario) && /^Seleccion (Uno|Dos)$/i.test(String(x.nombre||'').trim())) x.nombre = b.nombre; });
        // Fotos: igual que el sistema principal, la ruta definida en el código manda sobre la guardada
        usuarios.forEach(x => {
            const b = _listaBasePrueba.find(z => z.usuario === String(x.usuario).trim().toUpperCase());
            if (b && b.foto && x.foto !== b.foto) x.foto = b.foto;
        });
    } catch(e) {
        usuarios = [..._listaBasePrueba];
    }
}

// Muestra la foto junto al nombre en el encabezado (solo Conductor / Selección).
// Si no hay foto o no carga, vuelve al ícono de siempre.
function _pintarAvatarUsuario(u) {
    const img = document.getElementById('avatarUsuarioActivo');
    const ico = document.getElementById('iconoUsuarioActivo');
    if (!img || !ico) return;
    const mostrarIcono = () => { img.style.display = 'none'; img.removeAttribute('src'); ico.style.display = ''; };
    const foto = u && u.rol !== 'prueba' ? String(u.foto || '').trim() : '';
    if (!foto) { mostrarIcono(); return; }
    img.onerror = mostrarIcono;
    img.onload = () => { img.style.display = ''; ico.style.display = 'none'; };
    img.alt = (u.nombre || u.usuario || '') + '';
    img.src = foto;
}

function _mostrarErrorLogin(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
}

async function intentarLogin() {
    const u = (document.getElementById('inputUsuario').value || '').trim().toUpperCase();
    const p = document.getElementById('inputPassword').value || '';
    document.getElementById('loginError').style.display = 'none';
    if (!u || !p) { _mostrarErrorLogin('Ingresa usuario y contraseña.'); return; }

    await _cargarUsuarios();

    const candidato = usuarios.find(x => String(x.usuario).trim().toUpperCase() === u);
    if (!candidato || !_ROLES_PERMITIDOS.includes(candidato.rol)) {
        _mostrarErrorLogin('Usuario o contraseña incorrectos.');
        return;
    }

    const pHashSalted = await _hashConSalt(p, u);
    const pHashSimple = await _hashSimple(p);
    const okSalted = String(candidato.password).trim() === pHashSalted;
    const okViejo   = String(candidato.password).trim() === pHashSimple;
    if (!okSalted && !okViejo) {
        _mostrarErrorLogin('Usuario o contraseña incorrectos.');
        return;
    }

    _guardarSesionTab(candidato.usuario);
    _entrarApp(candidato);
}

// Entra a la app con un usuario ya validado (login normal o sesión restaurada tras refrescar)
function _entrarApp(candidato) {
    userLogueado = candidato;
    window.userLogueado = candidato;
    _cpReiniciarInactividad();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    _pintarAvatarUsuario(candidato);
    if (candidato.rol === 'prueba') {
        const numCandidatoHeader = String(candidato.usuario).trim().toUpperCase() === 'PRUEBA.1' ? '1' : '2';
        document.getElementById('nombreUsuarioActivo').textContent = 'Candidato ' + numCandidatoHeader;
        document.getElementById('cargoUsuarioActivo').textContent = '';
        document.querySelector('.app-header').style.maxWidth = '';
        cpIniciarVista();
    } else {
        // Conductor / Selección: su propio espacio (sin acceso al chat de prueba ni al sistema principal)
        const info = _CARGO_INFO[candidato.rol] || { icono: '👤', etiqueta: candidato.rol };
        document.getElementById('nombreUsuarioActivo').textContent = (candidato.nombre || candidato.usuario);
        document.getElementById('cargoUsuarioActivo').textContent = info.icono + ' ' + info.etiqueta;
        document.querySelector('.app-header').style.maxWidth = '900px';   // mismo ancho que el contenido de su espacio
        renderModuloCargo(candidato.rol);
    }
}


// ══════════ SESIÓN PERSISTENTE (sobrevive a refrescar la página) ══════════
// Se guarda solo el nombre de usuario y la hora de la última actividad en sessionStorage:
// vive únicamente en esta pestaña (al cerrarla se pierde) y nunca se guarda la contraseña.
const _SES_KEY = 'usd_prueba_sesion';
function _guardarSesionTab(usuario) {
    try { sessionStorage.setItem(_SES_KEY, JSON.stringify({ u: usuario, t: Date.now() })); } catch(e) {}
}
function _leerSesionTab() {
    try {
        const d = JSON.parse(sessionStorage.getItem(_SES_KEY) || 'null');
        if (!d || !d.u || (Date.now() - d.t) > _CP_INACTIVIDAD_MS) { sessionStorage.removeItem(_SES_KEY); return null; }
        return d;
    } catch(e) { return null; }
}
let _sesUltimoGuardado = 0;
function _tocarSesionTab() {   // renueva la hora de actividad (máx. 1 vez cada 5 s)
    if (!userLogueado || Date.now() - _sesUltimoGuardado < 5000) return;
    _sesUltimoGuardado = Date.now();
    _guardarSesionTab(userLogueado.usuario);
}
async function _restaurarSesion() {
    const d = _leerSesionTab();
    if (!d) return;
    const rs = document.getElementById('restoreScreen');
    document.getElementById('loginScreen').style.display = 'none';
    if (rs) rs.style.display = 'flex';
    const mostrarLogin = () => { if (rs) rs.style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; };
    try {
        for (let i = 0; i < 80 && !window._fbReady; i++) await new Promise(r => setTimeout(r, 100));  // espera a Firebase (máx. 8 s)
        if (!window._fbReady) { mostrarLogin(); return; }
        await _cargarUsuarios();
        const cand = usuarios.find(x => String(x.usuario).trim().toUpperCase() === String(d.u).trim().toUpperCase());
        if (!cand || !_ROLES_PERMITIDOS.includes(cand.rol)) { sessionStorage.removeItem(_SES_KEY); mostrarLogin(); return; }
        if (rs) rs.style.display = 'none';
        _entrarApp(cand);
    } catch(e) { console.warn('No se pudo restaurar la sesión', e); mostrarLogin(); }
}

// ══════════ CONDUCTOR / SELECCIÓN — espacio propio (datos en Firebase, mismas claves del sistema principal) ══════════
const _TARIFA = 5000, _VMAX = 250000;
const _K = { asig:'usd_cond_asignaciones', lab:'usd_cond_labores', sel:'usd_sel_registros', con:'usd_contratos', acu:'usd_acuerdos_confidencialidad' };
const _EST = [['ingresado','Ingresado','#3498db'],['revision_agencia','Revisión agencia','#f39c12'],['revision_pagina','Revisión página','#9b59b6'],['aprobado_pagina','Aprobado página','#2ecc71']];
const _e = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _hoy = () => new Date().toLocaleDateString('en-CA');
const _cop = n => '$' + Number(n||0).toLocaleString('es-CO');
const _hh = t => t ? new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '—';
const _uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const _nom = u => { const x = usuarios.find(z => z.usuario === u); return x ? (x.nombre || u) : u; };
const _leer = async k => window._fbValToArray(await window._fbCargar(k));
async function _tx(k, fn) {   // lectura-modificación-escritura atómica (evita pisar datos de otros)
    const { ref, runTransaction } = window._fbModules;
    return runTransaction(ref(window._fbDb, 'sistema/' + k), cur => { const a = window._fbValToArray(cur); const r = fn(a); return r === undefined ? a : r; });
}
const _c = { card:'background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;margin-bottom:10px;',
  inp:'background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:9px 12px;font-size:13px;',
  th:'text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;color:var(--textMuted);border-bottom:1px solid rgba(255,255,255,0.15);',
  td:'padding:8px 10px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.07);' };
const _b = c => `background:${c||'var(--accent)'};color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;`;
const _vacio = t => `<p style="color:var(--textMuted);text-align:center;padding:20px;">${t}</p>`;
const _mes = () => (document.getElementById('cgMes') || {}).value || _hoy().slice(0,7);
const _selMes = () => `<input type="month" id="cgMes" value="${_mes()}" onchange="cgVista(window._cgVista)" style="${_c.inp}">`;
// Igual que en el sistema principal: la nómina va dentro de una tarjeta con el título "Mi nómina"
const _nomEnvolver = cuerpo => `<div class="glass-card" style="padding:20px;"><h2 style="margin:0 0 18px;">💵 Nómina</h2>${cuerpo}</div>`;
const _tabla = (cols, filas) => filas.length ? `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><tr>${cols.map(x=>`<th style="${_c.th}">${x}</th>`).join('')}</tr>${filas.map(f=>`<tr>${f.map(x=>`<td style="${_c.td}">${x}</td>`).join('')}</tr>`).join('')}</table></div>` : '';

function renderModuloCargo(rol) {
    const cont = document.getElementById('chatPruebaContenido'); if (!cont) return;
    cont.style.maxWidth = '900px';
    window._cgRol = rol;
    const tabs = rol === 'conductor' ? [['labor','🚗 Ingreso labor'],['nomina','💵 Nómina'],['datos','📄 Datos personales']]
                                      : [['ingreso','📝 Ingreso'],['nomina','💵 Nómina'],['datos','📄 Datos personales']];
    cont.innerHTML = `<div id="cgTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;">${tabs.map(t=>`<button id="cgT_${t[0]}" onclick="cgVista('${t[0]}')" style="${_b('rgba(255,255,255,0.08)')}">${t[1]}</button>`).join('')}</div><div id="cgCuerpo" class="glass-card" style="padding:18px;"></div>`;
    cgVista(tabs[0][0]);
}
async function cgVista(v) {
    window._cgVista = v;
    document.querySelectorAll('#cgTabs button').forEach(b => b.style.background = b.id === 'cgT_' + v ? 'var(--accent)' : 'rgba(255,255,255,0.08)');

function _usdFechaIngreso(usuario) {
    const hv = (JSON.parse(localStorage.getItem('hojas_vida_usd')||'{}') || {})[usuario] || {};
    const _convertir = (val) => {
        if (!val) return null;
        const s = String(val).trim();
        // Número serial de Excel (ej: 46116)
        if (/^\d{4,5}$/.test(s)) {
            const d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
            const dd = String(d.getUTCDate()).padStart(2,'0');
            const mm = String(d.getUTCMonth()+1).padStart(2,'0');
            return `${dd}/${mm}/${d.getUTCFullYear()}`;
        }
        // Formato ISO yyyy-mm-dd
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
            const [a,m,d2] = s.split('-');
            return `${d2.substring(0,2)}/${m}/${a}`;
        }
        // Ya tiene formato legible — devolver tal cual
        return s;
    };
    if (hv.fechaIngreso && !_esValorLegadoIlegible(hv.fechaIngreso)) {
        const r = _convertir(hv.fechaIngreso);
        return r || hv.fechaIngreso.toUpperCase();
    }
    try {
        const nom = JSON.parse(localStorage.getItem('datos_nomina_usd')||'[]');
        const row = nom.find(r => (r.login||r.usuario||'').toLowerCase().trim() === (usuario||'').toLowerCase().trim());
        if (row && (row.fecha_ingreso||row.fecha_de_ingreso)) {
            const r = _convertir(row.fecha_ingreso||row.fecha_de_ingreso);
            return r || String(row.fecha_ingreso||row.fecha_de_ingreso).toUpperCase();
        }
    } catch(e) {}
    return '01/01/2025';
}

function _usdNombrePropio(s) {
    if (typeof aNombrePropio === 'function') return aNombrePropio(s);
    return (s||'').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function _pareceLoginNoCedula(valor, usuario) {
    if (!valor || !usuario) return false;
    const norm = s => (s||'').toString().toLowerCase().replace(/[^a-z0-9]/g,'');
    return norm(valor) === norm(usuario);
}

async function _usdCedula(usuario) {
    const hv = (JSON.parse(localStorage.getItem('hojas_vida_usd')||'{}') || {})[usuario] || {};
    const _hvCedRaw = (hv.cedula && hv.cedula.trim()) ? hv.cedula.trim() : (hv.documento && hv.documento.trim() ? hv.documento.trim() : '');
    if (_hvCedRaw) {
        // La cédula guardada en la hoja de vida está encriptada (ENC:...) por seguridad.
        // Si el descifrado falla (p.ej. quedó guardada con un formato de cifrado antiguo
        // ya no compatible), NO se debe devolver el texto cifrado: se sigue buscando
        // la cédula real más abajo (Excel de nómina / usuarios).
        const _cedDec = await _desencriptar(_hvCedRaw);
        if (_cedDec && _cedDec.trim() && !_pareceLoginNoCedula(_cedDec, usuario)) return _cedDec.trim();
    }
    // Buscar en nómina como fallback — buscar PRIMERO por login exacto
    try {
        const nom = JSON.parse(localStorage.getItem('datos_nomina_usd')||'[]');
        const _n = s => (s||'').toString().toLowerCase().trim()
            .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        const uLog = _n(usuario);
        // 1) Match por login exacto
        let row = nom.find(r => _n(r.login||r.usuario||'') === uLog);
        // 2) Match por login con formato nombre.apellido
        if (!row) {
            const usrs0 = JSON.parse(localStorage.getItem('usuarios_usd')||'[]');
            const uObj0 = usrs0.find(x => _n(x.usuario||'') === uLog);
            if (uObj0) {
                const uNomLogin = _n(uObj0.nombre||'').replace(/\s+/g,'.');
                row = nom.find(r => _n(r.login||r.usuario||'') === uNomLogin);
            }
        }
        // 3) Match por nombre si no encontró por login — exige coincidencia de
        // TODAS las palabras del nombre (no solo 2), igual que en _usdFilasNomina,
        // para que coordinadores con apellidos compuestos iguales/parecidos
        // (ej. "Castro Cifuentes") no se crucen entre sí.
        if (!row) {
            const usrs = JSON.parse(localStorage.getItem('usuarios_usd')||'[]');
            const uObj = usrs.find(x => _n(x.usuario||'') === uLog);
            if (uObj) {
                const uNom = _n(uObj.nombre||'');
                row = nom.find(r => {
                    const rNom = _n(r.nombres||r.nombre||'');
                    if (!rNom || !uNom) return false;
                    const pw = uNom.split(' ').filter(p=>p.length>2);
                    const pr = rNom.split(' ').filter(p=>p.length>2);
                    if (pw.length >= 3 && pr.length >= 3) {
                        // Nombre completo: exigir que TODAS las palabras buscadas estén presentes
                        return pw.every(p => pr.includes(p));
                    }
                    if (pw.length >= 2 && pr.length >= 2) {
                        // Nombres cortos: exigir coincidencia exacta de todas las palabras disponibles
                        return pw.filter(p=>pr.includes(p)).length === pw.length;
                    }
                    return false;
                });
            }
        }
        if (row) {
            // Columna DOCUMENTO es la cédula en el Excel
            const cc = String(row.documento||row.cedula||row.cc||row.doc||'').trim();
            if (cc && cc !== '0' && !_pareceLoginNoCedula(cc, usuario)) return cc;
        }
    } catch(e) {}
    // Buscar en usuarios
    try {
        const usrs = JSON.parse(localStorage.getItem('usuarios_usd')||'[]');
        const u = usrs.find(x => (x.usuario||'').toLowerCase() === (usuario||'').toLowerCase());
        if (u && u.cedula && !_pareceLoginNoCedula(u.cedula, usuario)) return u.cedula;
    } catch(e) {}
    return '___________';
}

async function _encriptar(texto) {
    if (!texto || typeof texto !== 'string' || texto.startsWith('ENC:')) return texto;
    try {
        const key = await _getAesKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(texto));
        const ivHex = Array.from(iv).map(b=>b.toString(16).padStart(2,'0')).join('');
        const encHex = Array.from(new Uint8Array(encrypted)).map(b=>b.toString(16).padStart(2,'0')).join('');
        return 'ENC:' + ivHex + encHex;
    } catch(e) { return texto; }
}

async function _desencriptar(texto) {
    if (!texto || typeof texto !== 'string') return texto;
    if (texto.startsWith('ENC:')) {
        try {
            const key = await _getAesKey();
            const hex = texto.slice(4);
            const iv = new Uint8Array(hex.slice(0,24).match(/.{2}/g).map(b=>parseInt(b,16)));
            const data = new Uint8Array(hex.slice(24).match(/.{2}/g).map(b=>parseInt(b,16)));
            return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, data));
        } catch(e) { return ''; }
    }
    // Formato de cifrado de una versión anterior del sistema (prefijo "__enc__" o similar)
    // que ya no es compatible con el algoritmo actual: no hay forma de recuperar el valor
    // original, así que se devuelve vacío en vez de mostrar el texto cifrado en pantalla.
    if (_esValorLegadoIlegible(texto)) return '';
    return texto;
}

async function _getAesKey() {
    if (_aesKey) return _aesKey;
    _aesKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(_AES_KEY_RAW), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
    return _aesKey;
}

function _esValorLegadoIlegible(v) {
    return typeof v === 'string' && /^_{1,2}enc_{1,2}/i.test(v.trim());
}

function _usdEsRepresentante(u) {
    const id = String((u && typeof u === 'object') ? u.usuario : (u || '')).trim().toUpperCase();
    return _USD_REPRESENTANTES.includes(id);
}

<div class="page">
  <div class="header"><div class="logo-box">USD</div><div><div class="company-name">USDINFORMATION</div><div class="company-sub">Amor real en un mundo digital</div><div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-family:'Segoe UI',Arial,sans-serif;">N° Registro: <strong style="color:#1a2744;">04070428</strong></div></div></div>
  <div class="meta">${wt(ciudad,'f-ciudad')}, ${wt(fechaDoc,'f-fecha')}</div>
  <span class="cert-badge">Contrato de Prestación de Servicios</span>
  <div class="company-id">Entre los suscritos, por una parte, <strong>USD INFORMATION</strong>, con domicilio en ${wt(ciudad,'f-ciudad2')}, representada legalmente por <strong>${wt(_USD_REP_NOMBRE,'f-repnombre')}</strong>, identificado(a) con C.C. ${wt(repCedula,'f-repcedula')}, quien para efectos del presente contrato se denominará <strong>EL CONTRATANTE</strong>; y por otra parte <strong>${wt(nombre,'f-nombre')}</strong>, identificado(a) con cédula de ciudadanía No. <strong>${wt(cedula,'f-cedula')}</strong>, quien para efectos del presente contrato se denominará <strong>EL CONTRATISTA</strong>, se celebra el presente CONTRATO DE PRESTACIÓN DE SERVICIOS, regido por las siguientes cláusulas:</div>

  <div class="campo-box" style="display:flex;gap:22px;flex-wrap:wrap;">
    <div style="flex:1;min-width:140px;"><div class="lbl">Nombre Completo</div><div class="val">${wt(nombre,'f-nombre2')}</div></div>
    <div style="flex:1;min-width:140px;"><div class="lbl">Documento de Identidad</div><div class="val">${wt(cedula,'f-cedula2')}</div></div>
    <div style="flex:1;min-width:140px;"><div class="lbl">Cargo / Función</div><div class="val">${wt(cargo,'f-cargo')}</div></div>
    ${_esEsp ? '' : `<div style="flex:1;min-width:140px;"><div class="lbl">Grupo</div><div class="val">${wt(grupo,'f-grupo')}</div></div>`}
    ${_esEsp ? '' : `<div style="flex:1;min-width:140px;"><div class="lbl">Plataforma</div><div class="val">${wt(plataforma,'f-plataforma')}</div></div>`}
    <div style="flex:1;min-width:140px;"><div class="lbl">Fecha de Ingreso</div><div class="val">${wt(fechaIngreso,'f-fechaingreso')}</div></div>
  </div>

  ${_esEsp ? _bloqueEsp : `  <div class="section-lbl">PRIMERA. OBJETO</div>
  <div class="body-text">EL CONTRATISTA se obliga a prestar de manera autónoma e independiente servicios relacionados con las actividades de CHAT CENTER, de acuerdo con el servicio, función o cargo de <strong>${wt(cargo,'f-cargo2')}</strong> registrado en los sistemas internos de USD INFORMATION.</div>
  <div class="body-text">El servicio comprende la gestión de conversaciones en las plataformas asignadas, atención y seguimiento de usuarios, desarrollo del plan de trabajo, cumplimiento de las metas establecidas y aplicación de los protocolos operativos y de calidad relacionados con el servicio.</div>

  <div class="section-lbl">SEGUNDA. ALCANCE Y ACTIVIDADES DEL SERVICIO</div>
  <div class="body-text">EL CONTRATISTA desarrollará las actividades necesarias para cumplir adecuadamente el objeto contractual, procurando los resultados y estándares de calidad establecidos para el servicio. Entre sus principales actividades se encuentran:</div>
  ${_numerados([
      'Realizar las actividades correspondientes al servicio de Chat Center.',
      'Cumplir las metas y objetivos establecidos para el período de liquidación.',
      'Ejecutar el plan de trabajo correspondiente al servicio contratado.',
      'Gestionar adecuadamente las plataformas y cuentas asignadas.',
      'Cumplir los protocolos y políticas relacionados con la correcta ejecución del servicio.',
      'Mantener la confidencialidad sobre la información a la que tenga acceso.',
      'Informar oportunamente cualquier situación que pueda afectar la correcta ejecución del servicio.',
      'Entregar la información, reportes, resultados o elementos que correspondan al desarrollo del servicio.'
  ], true)}

  <div class="section-lbl">TERCERA. ESQUEMA DE HONORARIOS Y METAS</div>
  <div class="body-text">La remuneración de EL CONTRATISTA estará determinada de acuerdo con el nivel de resultados obtenido durante cada período de liquidación, tomando como referencia la cantidad de puntos alcanzados durante el respectivo período. El esquema de honorarios será el siguiente:</div>
  <table class="tabla-hon"><thead><tr><th>Puntos obtenidos durante el período</th><th>Valor a pagar</th></tr></thead><tbody>
    <tr><td>0 a 944 puntos</td><td>$1.600</td></tr>
    <tr><td>945 a 1.214 puntos</td><td>$1.650</td></tr>
    <tr><td>1.215 puntos o más</td><td>$1.700</td></tr>
  </tbody></table>
  <div class="body-text">El valor correspondiente será determinado con base en los puntos efectivamente registrados para EL CONTRATISTA durante el período de liquidación. Los valores anteriormente establecidos corresponden al esquema económico pactado para la prestación del servicio y estarán sujetos a las retenciones, aportes o deducciones que legalmente correspondan.</div>
  ${_bonosCumplimiento}
  ${_bonoClausula}

  <div class="section-lbl">CUARTA. PERÍODO DE CORTE Y LIQUIDACIÓN</div>
  <div class="body-text">Para efectos de medición de resultados y liquidación de los honorarios, las partes acuerdan que cada período de trabajo comprenderá desde el día 11 de cada mes hasta el día 10 del mes siguiente. Los puntos obtenidos dentro de dicho período serán los utilizados para determinar el nivel de honorarios correspondiente.</div>
  <div class="body-text">Por ejemplo, el período comprendido entre el 11 de septiembre y el 10 de octubre será liquidado tomando en consideración los puntos obtenidos durante esas fechas.</div>

  <div class="section-lbl">QUINTA. INCUMPLIMIENTO DE POLÍTICAS Y AJUSTE DEL VALOR</div>
  <div class="body-text">EL CONTRATISTA se compromete a cumplir las políticas, protocolos, procedimientos y obligaciones relacionadas con la correcta ejecución del servicio. Cuando durante el respectivo período de corte se presente uno o varios incumplimientos comprobados de las políticas u obligaciones contractuales, debidamente registrados y comunicados a EL CONTRATISTA, se aplicará un ajuste de CINCUENTA PESOS ($50) sobre el valor del nivel de honorarios alcanzado durante dicho período. El ajuste de $50 será único por cada período de corte, independientemente del número de incumplimientos o llamados de atención que se presenten durante dicho período. En consecuencia, los valores aplicables serán:</div>
  <table class="tabla-hon"><thead><tr><th>Puntos obtenidos</th><th>Valor base</th><th>Valor con incumplimiento</th></tr></thead><tbody>
    <tr><td>0 a 944</td><td>$1.600</td><td>$1.550</td></tr>
    <tr><td>945 a 1.214</td><td>$1.650</td><td>$1.600</td></tr>
    <tr><td>1.215 o más</td><td>$1.700</td><td>$1.650</td></tr>
  </tbody></table>
  <div class="body-text">El ajuste económico se aplicará cuando exista un incumplimiento verificable y relacionado directamente con las obligaciones, políticas o protocolos previamente comunicados a EL CONTRATISTA. Para efectos de este contrato, el incumplimiento podrá constar mediante registros internos, informes, evidencias operativas, auditorías, reportes de calidad o cualquier otro medio que permita acreditar objetivamente la situación. El ajuste establecido en esta cláusula constituye una condición económica previamente pactada entre las partes respecto de los honorarios del servicio y no constituye una sanción disciplinaria laboral.</div>
  <div class="body-text"><strong>PARÁGRAFO PRIMERO. RETARDOS Y FALLAS.</strong> Los retardos y las fallas sin justificar se consideran incumplimientos de las políticas y obligaciones del servicio. En consecuencia, cuando se presenten durante el período de corte darán lugar al ajuste de CINCUENTA PESOS ($50) y a los valores con incumplimiento previstos en la tabla anterior, bajo las mismas reglas de esta cláusula (ajuste único por período de corte). Adicionalmente, y de forma independiente a dicho ajuste, se aplicarán las siguientes reglas sobre los bonos, entendiéndose por mes el período de corte definido en la cláusula CUARTA:</div>
  ${_numerados([
      '<strong>Retardos:</strong> al acumular dos (2) retardos dentro de una misma semana, EL CONTRATISTA perderá el bono semanal. Al acumular cinco (5) retardos dentro del mes, perderá el bono mensual.',
      '<strong>Fallas sin justificar:</strong> con una (1) falla sin justificar dentro de una misma semana, EL CONTRATISTA perderá el bono semanal. Al acumular tres (3) fallas sin justificar dentro del mes, perderá el bono mensual.'
  ], true)}
  <div class="body-text">La pérdida de los bonos prevista en este parágrafo se aplica además del ajuste del valor establecido en esta cláusula y no lo sustituye.${esSupervisor ? ' Cuando EL CONTRATISTA sea supervisor, la pérdida del bono semanal o mensual aplica a los dos bonos correspondientes (el de asesor y el de supervisor).' : ''}</div>
  <div class="body-text"><strong>PARÁGRAFO SEGUNDO. ANOTACIONES POR USO DEL TELÉFONO.</strong> Las anotaciones por uso del teléfono celular personal durante las horas de labor y atención en el turno, en contravía de lo establecido en el Reglamento Interno de Trabajo y en las políticas del servicio, debidamente registradas y comunicadas a EL CONTRATISTA, se acumularán durante la vigencia del contrato. Cuando EL CONTRATISTA acumule tres (3) anotaciones por uso del teléfono, se causará de forma automática un ajuste económico por valor de DIEZ MIL PESOS ($10.000), que se reflejará como descuento en la liquidación de honorarios correspondiente. Este mismo ajuste se causará nuevamente por cada nuevo grupo de tres (3) anotaciones acumuladas.${esSupervisor ? ' Cuando EL CONTRATISTA sea supervisor, también se entenderá como anotación por uso del teléfono la que se registre por no controlar el uso del celular personal por parte de los asesores a su cargo.' : ''}</div>
  `}

  <div class="section-lbl">SEXTA. DURACIÓN</div>
  <div class="body-text">El presente contrato tendrá una duración indefinida, iniciando el día ${wt(fechaIngreso,'f-fechainicio')}, y permanecerá vigente mientras subsista el objeto contractual y no se produzca alguna de las causales de terminación previstas en este documento.</div>

  <div class="section-lbl">SÉPTIMA. LUGAR DE PRESTACIÓN DEL SERVICIO</div>
  <div class="body-text">${_esEsp ? 'La prestación del servicio se realizará en los lugares, rutas y modalidades que EL CONTRATANTE disponga para el desarrollo de las actividades relacionadas con el objeto contractual.' : 'La prestación del servicio será realizada de manera presencial, en las instalaciones o lugar dispuesto por EL CONTRATANTE para el desarrollo de las actividades relacionadas con el objeto contractual.'} La ejecución presencial deberá coordinarse de acuerdo con las necesidades propias del servicio, conservando EL CONTRATISTA la autonomía e independencia que caracteriza la presente relación contractual.</div>

  <div class="section-lbl">OCTAVA. AUTONOMÍA E INDEPENDENCIA</div>
  <div class="body-text">EL CONTRATISTA manifiesta que celebra el presente contrato en calidad de contratista independiente y que desarrollará el objeto contractual con autonomía técnica, administrativa y operativa. Los protocolos, estándares de calidad, metas, procedimientos y lineamientos relacionados con el resultado y correcta ejecución del servicio constituyen condiciones propias del objeto contractual y no deberán interpretarse como subordinación laboral. EL CONTRATISTA será responsable de la correcta ejecución de las obligaciones que asume mediante este contrato.</div>

  <div class="section-lbl">NOVENA. OBLIGACIONES DE EL CONTRATISTA</div>
  <div class="body-text">EL CONTRATISTA se obliga a:</div>
  ${_numerados([
      'Ejecutar personalmente las actividades necesarias para el cumplimiento del objeto contratado.',
      'Cumplir las metas y resultados establecidos.',
      'Ejecutar el plan de trabajo correspondiente.',
      'Observar las políticas de seguridad, confidencialidad, protección de información y uso adecuado de las herramientas.',
      'No compartir, transferir, vender, copiar o utilizar para beneficio propio o de terceros información obtenida durante la prestación del servicio.',
      'No divulgar información relacionada con clientes, modelos, usuarios, plataformas, cuentas, procesos, estrategias, resultados o bases de datos de USD INFORMATION.',
      'Informar cualquier incidente que pueda afectar la seguridad de la información.',
      'Restituir los equipos, documentos, materiales y accesos que pertenezcan a EL CONTRATANTE al finalizar el servicio.'
  ], true)}

  ${_obligEsp}

  <div class="section-lbl">DÉCIMA. OBLIGACIONES DE EL CONTRATANTE</div>
  <div class="body-text">EL CONTRATANTE se obliga a:</div>
  ${_numerados([
      'Suministrar la información necesaria para la ejecución del objeto contractual.',
      'Facilitar, cuando corresponda, los accesos, herramientas o recursos necesarios para el servicio.',
      'Informar las condiciones aplicables al cálculo de los honorarios y comisiones.',
      'Realizar los pagos correspondientes conforme al esquema pactado.',
      'Dar tratamiento a la información personal conforme a la legislación aplicable.'
  ], true)}

  <div class="section-lbl">DÉCIMA PRIMERA. CONFIDENCIALIDAD Y RESERVA</div>
  <div class="body-text">EL CONTRATISTA deberá mantener absoluta reserva sobre toda información confidencial a la que tenga acceso con ocasión del contrato. Se considera información confidencial, entre otra, la relacionada con clientes, modelos, usuarios, fotografías, videos, conversaciones, cuentas, contraseñas, bases de datos, estrategias, procedimientos, documentos, información financiera, información comercial, material de trabajo y cualquier otra información interna de USD INFORMATION. EL CONTRATISTA no podrá divulgar, reproducir, almacenar, transferir o utilizar dicha información para fines diferentes a la ejecución del contrato. Esta obligación permanecerá vigente incluso después de la terminación del contrato.</div>

  <div class="section-lbl">DÉCIMA SEGUNDA. PROTECCIÓN DE DATOS PERSONALES</div>
  <div class="body-text">EL CONTRATISTA se compromete a tratar los datos personales únicamente para los fines autorizados y relacionados con el objeto contractual. Deberá adoptar las medidas necesarias para evitar la pérdida, divulgación, modificación, consulta o acceso no autorizado a dicha información. Queda prohibido copiar, descargar, almacenar, transferir o compartir información personal para fines particulares o ajenos al servicio contratado.</div>

  <div class="section-lbl">DÉCIMA TERCERA. USO DE CUENTAS, PLATAFORMAS Y EQUIPOS</div>
  <div class="body-text">Las cuentas, usuarios, contraseñas, plataformas, equipos, documentos, materiales y demás recursos proporcionados por EL CONTRATANTE serán utilizados exclusivamente para el desarrollo del objeto contractual. EL CONTRATISTA no podrá prestar, transferir, vender, compartir o permitir el acceso de terceros a las cuentas o credenciales asignadas. Al finalizar el contrato deberá devolver los elementos recibidos y cesar inmediatamente el uso de los accesos proporcionados.</div>

  <div class="section-lbl">DÉCIMA CUARTA. PROPIEDAD Y USO DEL MATERIAL</div>
  <div class="body-text">Todo material, documento, información, contenido, metodología, archivo, reporte, diseño, pieza o recurso elaborado específicamente para EL CONTRATANTE dentro de la ejecución del servicio deberá utilizarse exclusivamente para los fines autorizados por USD INFORMATION. EL CONTRATISTA no podrá copiar, comercializar, publicar, transferir, reproducir o utilizar dicho material para beneficio propio o de terceros sin autorización previa y expresa.</div>

  <div class="section-lbl">DÉCIMA QUINTA. CUMPLIMIENTO DE POLÍTICAS</div>
  <div class="body-text">EL CONTRATISTA declara conocer y aceptar las políticas, protocolos y condiciones aplicables al servicio. El incumplimiento comprobado de las obligaciones contractuales, políticas de confidencialidad, seguridad, protección de información, uso de plataformas o demás condiciones pactadas podrá generar las consecuencias económicas expresamente previstas en este contrato y, cuando corresponda, constituir causal de terminación.</div>

  <div class="section-lbl">DÉCIMA SEXTA. SEGURIDAD SOCIAL</div>
  <div class="body-text">EL CONTRATISTA será responsable de cumplir las obligaciones que legalmente le correspondan en materia de seguridad social, aportes y demás obligaciones derivadas de su condición de trabajador independiente, cuando sean aplicables.</div>

  <div class="section-lbl">DÉCIMA SÉPTIMA. TERMINACIÓN DEL CONTRATO</div>
  <div class="body-text">El presente contrato podrá terminar por cualquiera de las siguientes causas:</div>
  ${_numerados([
      'Mutuo acuerdo entre las partes.',
      'Incumplimiento de las obligaciones contractuales.',
      'Incumplimiento grave de las políticas de confidencialidad, seguridad o protección de información.',
      'Uso indebido de cuentas, plataformas, equipos o información.',
      'Divulgación o utilización no autorizada de información confidencial.',
      'Abandono injustificado de las actividades necesarias para la ejecución del objeto contractual.',
      'Imposibilidad legal o material de continuar ejecutando el objeto contractual.',
      'Desaparición de la necesidad que dio origen al servicio.',
      `Decisión unilateral de cualquiera de las partes, mediante aviso previo de ${wt('30','f-diasaviso')} días calendario, salvo que exista una causal de terminación inmediata.`,
      'Cualquier otra causal establecida legalmente o acordada entre las partes.'
  ], true)}
  <div class="body-text">La terminación no afectará las obligaciones que por su naturaleza deban continuar vigentes, especialmente las relacionadas con confidencialidad, protección de datos, propiedad de información y devolución de elementos.</div>

  <div class="section-lbl">DÉCIMA OCTAVA. DEVOLUCIÓN DE INFORMACIÓN Y ELEMENTOS</div>
  <div class="body-text">Al finalizar el contrato, EL CONTRATISTA deberá entregar todos los equipos, documentos, archivos, materiales, accesos, credenciales y demás elementos pertenecientes a USD INFORMATION. Asimismo, deberá eliminar cualquier copia no autorizada de información confidencial o datos personales que conserve en sus dispositivos.</div>

  <div class="section-lbl">DÉCIMA NOVENA. NO CESIÓN</div>
  <div class="body-text">EL CONTRATISTA no podrá ceder total o parcialmente las obligaciones derivadas del presente contrato ni permitir que terceros ejecuten las actividades contratadas sin autorización previa y expresa de EL CONTRATANTE.</div>

  <div class="section-lbl">VIGÉSIMA. SOLUCIÓN DE CONTROVERSIAS</div>
  <div class="body-text">Las partes procurarán resolver directamente cualquier diferencia relacionada con la interpretación, ejecución o terminación del presente contrato. En caso de no lograrse un acuerdo, podrán acudir a los mecanismos de conciliación y demás mecanismos legalmente disponibles.</div>

  <div class="section-lbl">VIGÉSIMA PRIMERA. LEGISLACIÓN APLICABLE</div>
  <div class="body-text">El presente contrato se regirá por las leyes de la República de Colombia y las normas aplicables a su naturaleza contractual.</div>

  <div class="section-lbl">VIGÉSIMA SEGUNDA. INTEGRIDAD DEL CONTRATO</div>
  <div class="body-text">El presente documento contiene el acuerdo entre las partes respecto del objeto contratado y reemplaza cualquier acuerdo anterior, verbal o escrito, relacionado con el mismo objeto, salvo aquellos documentos que expresamente se incorporen como parte integral del contrato.</div>
  <div class="body-text">En constancia de lo anterior, las partes manifiestan haber leído, comprendido y aceptado el contenido del presente contrato y lo suscriben en ${wt(ciudad,'f-ciudad3')}, a los ${wt(new Date().getDate().toString(),'f-dia')} días del mes de ${wt(['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][new Date().getMonth()],'f-mes')} de ${wt(new Date().getFullYear().toString(),'f-anio')}.</div>

  <div class="firma-area">
    <div class="firma-col">
      <div class="firma-slot"><img class="firma-img" src="${_FIRMA_BRANDON_B64}" alt="Firma"></div>
      <div class="firma-linea"><div class="firma-name">${wt(_USD_REP_NOMBRE,'f-firmante')}</div><div class="firma-cargo">Representante Legal — USDINFORMATION</div></div>
    </div>
    <div class="firma-col">
      <div class="firma-slot">${(datos.estado === 'aceptado') ? `<div class="firma-name">${wt(nombre,'f-nombre-firma')}<span class="firma-digital-tag">(Firma digital)</span></div>` : ''}</div>
      <div class="firma-linea"><div class="firma-name">${wt(nombre,'f-nombre-firma-abajo')}</div><div class="firma-cargo">EL CONTRATISTA</div>${datos.estado === 'aceptado' && datos.fechaAceptacion ? `<div class="firma-cargo" style="margin-top:2px;">Firmado el ${new Date(datos.fechaAceptacion).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>` : (datos.firmaFisica ? `<div class="firma-cargo" style="margin-top:2px;">Firmado en persona</div>` : '')}</div>
    </div>
  </div>
  <div class="footer-note">Documento generado digitalmente por USDINFORMATION · No requiere sello físico</div>
  <div style="text-align:center;margin-top:18px;"><button onclick="window.print()" style="background:#1a2744;color:#fff;border:none;padding:9px 28px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Segoe UI',Arial,sans-serif;">🖨️ Imprimir / Guardar PDF</button></div>
</div>
</body></html>`;
}

async function _usdHTMLAcuerdoConfidencialidad(u, datos, _editable) {
    const nombre       = ((typeof _usdNombrePropio === 'function') ? _usdNombrePropio(u.nombre) : (u.nombre||''));
    const cedula       = (typeof _usdCedula === 'function') ? await _usdCedula(u.usuario) : (u.cedula || '—');
    const _rolCargoMap = {
        'admin': 'ADMINISTRADOR', 'coordinador': 'COORDINADOR', 'supervisor1': 'SUPERVISOR',
        'supervisor2': 'SUPERVISOR', 'capacitador': 'CAPACITADOR', 'calidad': 'ANALISTA DE CALIDAD', 'asesor': 'ASESOR'
    };
    const cargo         = _usdEsRepresentante(u) ? 'REPRESENTANTE' : (_rolCargoMap[u.rol] || 'ASESOR');
    const fechaIngreso  = (typeof _usdFechaIngreso === 'function') ? _usdFechaIngreso(u.usuario) : '—';

function _contratosCargar() {

function _contratoDeUsuario(usuario) {

function _contratoAsegurar(u) {
    let r = _contratoDeUsuario(u.usuario);
    if (r) return r;
    r = {

        usuario: u.usuario,
        nombre: (typeof _usdNombrePropio === 'function') ? _usdNombrePropio(u.nombre) : u.nombre,

    };
    const lista = _contratosCargar();
    lista.unshift(r);
    _contratosGuardar(lista);
    return r;
}

function usdFirmarContrato(id) {
    if (!window.userLogueado) return;
    const lista = _contratosCargar();

function _usdAbrirPDF(html, titulo) {
    try {
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.target   = '_blank';
        a.rel      = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        if(typeof toast==='function') toast('📄 '+titulo+' lista. Usa "Guardar como PDF".','success');
    } catch(e) {
        console.error('Error abriendo PDF:', e);
        if(typeof toast==='function') toast('Error al generar el PDF. Intenta de nuevo.','error');
    }
}

window.toast = function(msg, tipo) { if (tipo === 'error') alert(msg); else console.log(msg); };

const _CG_DOCS = { con:'usd_contratos', acu:'usd_acuerdos_confidencialidad' };
async function _cgMezclarFB(clave, rec) {   // guarda solo el registro propio, sin pisar el de otros
    try {
        const { ref, runTransaction } = window._fbModules;
        await runTransaction(ref(window._fbDb, 'sistema/' + clave), cur => {
            const a = window._fbValToArray(cur), i = a.findIndex(x => x.usuario === rec.usuario);
            if (i >= 0) a[i] = rec; else a.unshift(rec);
            return a;
        });
    } catch(e) { console.warn('No se pudo sincronizar', clave, e); alert('No se pudo guardar. Revisa tu conexión e intenta de nuevo.'); }
}
function _cgGuardarPropio(clave, lista) {
    localStorage.setItem(clave, JSON.stringify(lista));
    const yo = window.userLogueado && window.userLogueado.usuario;
    lista.filter(x => x.usuario === yo).forEach(r => _cgMezclarFB(clave, r));
}
_contratosGuardar = function(l) { _cgGuardarPropio(_CG_DOCS.con, l); };
_acuerdosGuardar  = function(l) { _cgGuardarPropio(_CG_DOCS.acu, l); };
// Trae de Firebase solo lo necesario del propio usuario (y de los representantes legales para el contrato)
async function cgPrepararDocs() {
    const yo = userLogueado.usuario, ids = [yo, ..._USD_REPRESENTANTES];
    const norm = s => String(s||'').trim().toUpperCase();
    const hv = (await window._fbCargar('hojas_vida_usd')) || {}, hvF = {};
    // Firebase no admite . # $ / [ ] en las claves: al guardar, "SELECCION.1" queda como "SELECCION_1".
    // Aquí se busca la hoja de vida por el ID real o por su versión saneada (igual que
    // _repararClavesUsuario en el sistema principal) y se guarda en local con el ID real.
    const san = id => String(id).replace(/[.#$\/\[\]]/g, '_');
    const hvKeys = Object.keys(hv);
    ids.forEach(id => {
        const k = hv[id] ? id
            : (hvKeys.find(x => x === san(id))
            || hvKeys.find(x => x.toUpperCase() === san(id).toUpperCase())
            || hvKeys.find(x => x.toUpperCase() === String(id).toUpperCase()));
        if (k && hv[k]) hvF[id] = hv[k];
    });
    localStorage.setItem('hojas_vida_usd', JSON.stringify(hvF));
    const nom = window._fbValToArray(await window._fbCargar('datos_nomina_usd'));
    localStorage.setItem('datos_nomina_usd', JSON.stringify(nom.filter(r => ids.map(norm).includes(norm(r.login || r.usuario)))));
    localStorage.setItem('usuarios_usd', JSON.stringify(usuarios.filter(u => ids.map(norm).includes(norm(u.usuario))).map(u => { const c = {...u}; delete c.password; return c; })));
    localStorage.setItem(_CG_DOCS.con, JSON.stringify(window._fbValToArray(await window._fbCargar(_CG_DOCS.con)).filter(x => x.usuario === yo)));
    localStorage.setItem(_CG_DOCS.acu, JSON.stringify(window._fbValToArray(await window._fbCargar(_CG_DOCS.acu)).filter(x => x.usuario === yo)));
}
function cgLimpiarDocs() { ['hojas_vida_usd','datos_nomina_usd','usuarios_usd',_CG_DOCS.con,_CG_DOCS.acu].forEach(k => localStorage.removeItem(k)); }

}

function cpRenderCandidato() {
    const cont = document.getElementById('chatPruebaContenido');
    if (!cont) return;

    if (!_cpSlotPropio) {
        _cpSlotPropio = userLogueado.usuario === 'PRUEBA.1' ? 'prueba1' : 'prueba2';
    }

    if (window._cpListenerSesion) { try { window._cpListenerSesion(); } catch(e){} window._cpListenerSesion = null; }
    try {
        const { getDatabase, ref, onValue } = window._fbModules || {};
        if (onValue && getDatabase) {
            const db = getDatabase();
            window._cpListenerSesion = onValue(ref(db, 'sistema/usd_cp_sesion_activa'), (snap) => {
                const sesion = snap.exists() ? snap.val() : null;
                _cpProcesarSesionCandidato(sesion);
            });
            return;
        }
    } catch(e) {}
    const _pollSesion = () => {
        if (!document.getElementById('chatPruebaContenido')) return;
        window._fbCargar('usd_cp_sesion_activa').then(sesion => {
            _cpProcesarSesionCandidato(sesion);
            if (!_cpSesionId) setTimeout(_pollSesion, 4000);
        });
    };
    _pollSesion();
}

function cpRegistrarDatosCandidato() {
    const nombre = (document.getElementById('cpInputNombre')?.value || '').trim();

    if (!nombre || !cedula) { alert('Por favor ingresa tu nombre y cédula.'); return; }

    _cpMensajesLocal = [];

    window._fbCargar('usd_cp_sesion_activa').then(sesion => {
        if (!sesion) return;
        sesion[_cpSlotPropio] = { ...sesion[_cpSlotPropio], nombre, cedula, listo: true };
        // Actualizar cédula en el registro del usuario de prueba (para que el formador
        // pueda vincular la calificación). Se recarga la lista completa justo antes de
        // guardar, para no pisar datos de otros usuarios con una copia desactualizada.
        window._fbCargar('usuarios_usd').then(dataUsuarios => {
            const listaCompleta = dataUsuarios ? window._fbValToArray(dataUsuarios) : usuarios;
            const u = listaCompleta.find(x => x.usuario === userLogueado.usuario);
            if (u) { u.cedula = cedula; u.nombre = nombre; }
            if (window._fbGuardar) window._fbGuardar('usuarios_usd', listaCompleta);

        if (window._fbGuardar) window._fbGuardar('usd_cp_sesion_activa', sesion);
        cpMostrarIntroPrueba(sesion);

function _cpActivarListenerMensajes() {
    if (!_cpSesionId || !window._fbCargar) return;
    if (_cpListenerActivo) { try { _cpListenerActivo(); } catch(e){} _cpListenerActivo = null; }

    try {
        const { getDatabase, ref, onValue } = window._fbModules || {};
        if (onValue && getDatabase) {
            const db = getDatabase();
            const unsubscribe = onValue(ref(db, 'sistema/usd_cp_mensajes_' + _cpSesionId), (snap) => {
                const val = snap.exists() ? snap.val() : [];
                _cpMensajesLocal = window._fbValToArray ? window._fbValToArray(val) : (Array.isArray(val) ? val : []);
                const filtrados = _cpMensajesLocal.filter(m => m.canal === _cpSlotPropio || m.canal === 'todos' || m.de === _cpSlotPropio);
                _cpRenderMensajes(filtrados);
            });
            _cpListenerActivo = unsubscribe;
            return;
        }
    } catch(e) {}

    _cpMensajesLocal = [];
    const _pollMsgs = () => {
        if (!_cpSesionId || document.getElementById('cpMsgBox') === null) return;
        window._fbCargar('usd_cp_mensajes_' + _cpSesionId).then(msgs => {
            _cpMensajesLocal = Array.isArray(msgs) ? msgs : [];
            const filtrados = _cpMensajesLocal.filter(m => m.canal === _cpSlotPropio || m.canal === 'todos' || m.de === _cpSlotPropio);
            _cpRenderMensajes(filtrados);
            _cpListenerActivo = setTimeout(_pollMsgs, 3000);
        });
    };
    _pollMsgs();
}

function cpEnviarCandidato() {
    const input = document.getElementById('cpInputMsg');
    const texto = (input?.value || '').trim();
    if (!texto || !_cpSesionId) return;
    input.value = '';
    const msg = { de: _cpSlotPropio, nombreDe: _cpNombreLocal, canal: _cpSlotPropio, texto, ts: Date.now() };
    _cpMensajesLocal.push(msg);
    const filtrados = _cpMensajesLocal.filter(m => m.canal === _cpSlotPropio || m.canal === 'todos' || m.de === _cpSlotPropio);
    _cpRenderMensajes(filtrados);
    if (window._fbGuardar) window._fbGuardar('usd_cp_mensajes_' + _cpSesionId, _cpMensajesLocal);
}

function _cpComprimirImagen(dataUrl, callback) {
    const MAX_BYTES = 80 * 1024;
    const img = new Image();
    img.onload = function() {
        let w = img.width, h = img.height;
        const MAX_DIM = 800;
        if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
            else       { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let quality = 0.75;
        let result = canvas.toDataURL('image/jpeg', quality);
        while (result.length > MAX_BYTES && quality > 0.1) {
            quality -= 0.08;
            if (quality < 0.4 && (w > 400 || h > 400)) {
                w = Math.round(w * 0.8); h = Math.round(h * 0.8);
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                quality = 0.6;
            }
            result = canvas.toDataURL('image/jpeg', quality);
        }
        callback(result);
    };
    img.onerror = () => callback(dataUrl);
    img.src = dataUrl;
}

function cpAdjuntarImgCandidato(input) {
    const file = input.files[0];
    if (!file || !_cpSesionId) return;
    const reader = new FileReader();
    reader.onload = e => {
        _cpComprimirImagen(e.target.result, (comprimido) => {
            const _subir = (window._fbSubirFoto)
                ? window._fbSubirFoto(comprimido, `cp_adjuntos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`)
                : Promise.resolve(null);
            _subir.then(url => {
                const msg = { de: _cpSlotPropio, nombreDe: _cpNombreLocal, canal: _cpSlotPropio, texto: '📷 Imagen adjunta', img: url || comprimido, ts: Date.now() };
                _cpMensajesLocal.push(msg);
                const filtrados = _cpMensajesLocal.filter(m => m.canal === _cpSlotPropio || m.canal === 'todos' || m.de === _cpSlotPropio);
                _cpRenderMensajes(filtrados);
                if (window._fbGuardar) window._fbGuardar('usd_cp_mensajes_' + _cpSesionId, _cpMensajesLocal);
            });
        });
    };
    reader.readAsDataURL(file);
    input.value = '';
}

function _cpRenderMensajes(filtrados) {
    const box = document.getElementById('cpMsgBox');
    if (!box) return;
    box.innerHTML = filtrados.length
        ? filtrados.map(m => {
            const esPropio = m.de === _cpSlotPropio;
            const imgHTML  = m.img ? `<img src="${m.img}" style="max-width:200px;border-radius:8px;display:block;margin-top:4px;">` : '';
            return `<div style="display:flex;flex-direction:column;align-items:${esPropio?'flex-end':'flex-start'};margin-bottom:8px;">
                <div style="background:${esPropio?'rgba(52,152,219,0.25)':'rgba(255,255,255,0.07)'};border-radius:10px;padding:9px 13px;max-width:80%;font-size:13px;">
                    ${m.texto}${imgHTML}
                </div>
            </div>`;
        }).join('')
        : `<div style="text-align:center;color:rgba(255,255,255,0.2);font-size:12px;padding:30px;">Esperando mensajes del formador...</div>`;
    box.scrollTop = box.scrollHeight;
}

// Permitir Enter en el formulario de login
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('inputPassword').addEventListener('keydown', e => { if (e.key === 'Enter') intentarLogin(); });
    document.getElementById('inputUsuario').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inputPassword').focus(); });
});
</script>
